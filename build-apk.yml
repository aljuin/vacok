name: Build APK

# Запуск: GitHub → Actions → Build APK → Run workflow → впишите адрес сервера.
# Каждая сборка получает номер версии = номер запуска, поэтому обновления ставятся поверх старых.
# Нужны секреты: KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (см. make-keystore.yml).

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Адрес сервера с https, без / в конце, например https://chat.example.com'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Подготовка ключа подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Сборка подписанного APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease --no-daemon
          -PserverUrl=${{ inputs.server_url }}
          -PversionCode=${{ github.run_number }}
          -PversionName=1.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: messenger-apk
          path: android/app/build/outputs/apk/release/app-release.apk
