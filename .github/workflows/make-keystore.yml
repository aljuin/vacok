name: Make signing key (one time)

# Запускается один раз. Создаёт постоянный ключ подписи APK.
# Перед запуском добавьте секрет KEYSTORE_PASSWORD (придумайте пароль и запишите его).
# Ключ появляется в артефакте key-b64: скопируйте содержимое в секрет KEYSTORE_B64,
# затем удалите артефакт и этот workflow. Потеряете ключ — обновления перестанут ставиться.

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Создать ключ
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
            -storepass "$PW" -keypass "$PW" -alias messenger \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Messenger"
          base64 -w0 release.jks > key.b64
          echo "KEY_ALIAS=messenger (записать в секрет KEY_ALIAS)"

      - uses: actions/upload-artifact@v4
        with:
          name: key-b64
          path: key.b64
