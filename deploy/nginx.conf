# Замените messenger.example.com на ваш домен. Файл кладётся в /etc/nginx/sites-available/messenger
# и включается ссылкой в /etc/nginx/sites-enabled/ (делает setup.sh).

server {
    listen 80;
    server_name messenger.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name messenger.example.com;

    # Сертификаты выдаёт certbot (setup.sh); пути появятся после его работы
    ssl_certificate     /etc/letsencrypt/live/messenger.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messenger.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 80m;          # совпадает с MAX_UPLOAD_MB по умолчанию

    # Сжатие текста и JSON: меньше байт — быстрее загрузка и ответы API
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Живой канал сообщений (SSE): ответы не буферизуются, соединение не рвётся
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;   # загрузка фото и голосовых идёт потоком
        proxy_read_timeout 120s;
    }
}
