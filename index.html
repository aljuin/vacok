.msg{max-width:80%;padding:6px 8px 4px;border-radius:13px;background:var(--in);align-self:flex-start;border-bottom-left-radius:5px;line-height:1.35;word-wrap:break-word}

.logo{width:68px;height:68px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;color:#fff;background:var(--accg);box-shadow:0 10px 30px rgba(80,100,255,.45)}
.ab h1{text-align:center;font-size:24px}.ab .sub{text-align:center;color:var(--mute);margin:6px 0 18px}

.msg.media{position:relative;padding:3px;max-width:76%}

.pl svg{position:relative}

.vc{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.vp{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);color:inherit;transition:transform .2s var(--ease)}.vp:active{transform:scale(.88)}
.msg:not(.me) .vp{background:var(--accg);color:#fff}

.vw{flex:1;display:flex;align-items:center;gap:2px;height:28px}
.vw i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.38;transition:opacity .15s}.vw i.on{opacity:1}
.vd{min-width:32px;font-size:12px;opacity:.85;text-align:right;font-variant-numeric:tabular-nums}
.vwr{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.93);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.vwr.open{opacity:1;visibility:visible;transition:opacity .3s}
#vbody{width:100%;height:100%;display:grid;place-items:center;padding:56px 0 16px}
#vbody img,#vbody video{max-width:100%;max-height:100%;border-radius:8px;transform:scale(.94);transition:transform .45s var(--ease)}
.vwr.open #vbody img,.vwr.open #vbody video{transform:none}
.vx{position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}

.send .ic{inset:0;width:100%;height:100%;justify-self:stretch;align-self:stretch}
.send{width:40px;height:40px;background:linear-gradient(145deg,#4a9bff,#6a5cff);box-shadow:0 4px 14px rgba(80,100,255,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.send:before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(90,120,255,.55);opacity:0;pointer-events:none}
.recording .send:before{animation:ring 1.4s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.85)}to{opacity:0;transform:scale(1.5)}}
.recording .send{background:linear-gradient(145deg,#ff6a6a,#ff3d77);box-shadow:0 4px 14px rgba(255,80,110,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.recording .send:before{border-color:rgba(255,90,110,.6)}.recording{box-shadow:0 0 0 1px rgba(255,80,110,.35),0 8px 26px rgba(255,80,110,.2)}.recording .rdot{animation:recPulse 1s ease-in-out infinite}@keyframes recPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.45}}.recording .lv i{transition:height .12s ease-out;background:linear-gradient(180deg,#ff8a9b,#ff3d77)}.recording #rT{font-variant-numeric:tabular-nums}.rbar{display:none;align-items:center;gap:10px;margin:6px 10px 0;padding:7px 8px 7px 12px;border-radius:14px;background:var(--card);border-left:3px solid var(--acc);box-shadow:0 4px 14px rgba(0,0,0,.18)}.rbar.on{display:flex;animation:rbIn .3s var(--ease)}@keyframes rbIn{from{transform:translateY(8px);opacity:0}}.rbt{flex:1;min-width:0;display:flex;flex-direction:column}.rbt b{font-size:13px;color:var(--acc)}.rbt span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#rbX{font-size:22px;line-height:1;color:var(--mute);padding:4px 6px}.quo{margin:0 0 5px;padding:4px 8px;border-radius:8px;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--ink) 7%,transparent);font-size:13px;min-width:0}.quo b{display:block;font-size:12px;color:var(--acc)}.quo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8;max-width:240px}.vco{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(8,10,16,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}.vco.open{opacity:1;visibility:visible;transition:opacity .3s}.vcw{position:relative;width:min(270px,72vw);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 0 4px rgba(255,255,255,.14)}.vco.rec .vcw{animation:vcGlow 1.2s ease-in-out infinite}@keyframes vcGlow{50%{box-shadow:0 0 0 4px rgba(255,255,255,.14),0 0 0 16px rgba(255,80,110,.32)}}#vcPrev{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.vcT{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:3px 11px;border-radius:12px;background:rgba(0,0,0,.5);color:#fff;font-size:14px;font-variant-numeric:tabular-nums}.vcb{display:flex;align-items:center;gap:36px}#vcCancel{color:#fff;font-size:16px;opacity:.85;padding:10px}#vcRec{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;transition:transform .2s var(--ease)}#vcRec:active{transform:scale(.92)}#vcRec i{width:56px;height:56px;border-radius:50%;background:#ff3d5a;transition:border-radius .35s var(--ease),transform .35s var(--ease)}.vco.rec #vcRec i{border-radius:10px;transform:scale(.5)}.vcirc{position:relative;width:200px;height:200px;border-radius:50%;overflow:hidden;background:#000;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}.vcirc video{width:100%;height:100%;object-fit:cover;display:block}.vcirc .pl2{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28);color:#fff;transition:opacity .25s}.vcirc.playing .pl2{opacity:0}.vcirc .dd{position:absolute;right:10px;bottom:8px;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-style:normal}.msg.circ{background:none;box-shadow:none;padding:0}.msg.circ small{display:block;text-align:right;padding-top:3px}
.send:active{transform:scale(.9)}
.rec{animation:rin .35s var(--ease)}
@keyframes rin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.go.alt{background:var(--hov);color:var(--ink);box-shadow:none}
.lk{color:var(--acc);text-decoration:none;cursor:pointer;word-break:break-word}
.lk:active{opacity:.6}
.msg.me .lk{color:#fff;text-decoration:underline;text-underline-offset:2px}
.msg.hl{animation:flash 1.5s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 70%,transparent)}100%{box-shadow:0 0 0 3px transparent}}
.res b{display:block;font-size:15px;font-weight:600}.res span{display:block;color:var(--mute);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res time{font-size:12px;color:var(--mute);align-self:flex-start;padding-top:3px}

#app{overflow:clip}

nav{height:70px;border-radius:35px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .45s cubic-bezier(.22,1,.36,1)}
nav button{padding-top:3px;gap:2px}
.ico{height:44px;transform:scale(.8);filter:none;will-change:transform;transition:transform .42s cubic-bezier(.22,1,.36,1)}
nav button.on .ico{transform:none;filter:none}
nav button:active .ico{transform:scale(.72)}
nav button.on:active .ico{transform:scale(.92)}
.pill{transition:transform .42s cubic-bezier(.22,1,.36,1);will-change:transform}
.nb{top:0;left:27px}
.view{padding-bottom:104px;transition:opacity .3s,transform .42s cubic-bezier(.22,1,.36,1);will-change:transform,opacity}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.st{animation-duration:.38s;animation-delay:calc(var(--i,0)*26ms)}
#app.chatting nav{transform:translateY(150%)}
#app.chatting .view.on{transform:translateX(-22%);opacity:.4}

.rowS .ava{flex:none}
.net{position:absolute;top:8px;left:50%;z-index:55;transform:translate(-50%,-180%);padding:6px 14px;border-radius:16px;background:var(--card);color:var(--mute);font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);border:1px solid var(--line);transition:transform .45s cubic-bezier(.22,1,.36,1)}
.net.show{transform:translate(-50%,0)}
.msg small .bad{color:#ffd0d0;font-weight:700;font-style:normal}
.msg.fail{cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <section class="view left" id="vCon">
    <div class="top"><h1>Контакты</h1><button class="sq" id="s2" aria-label="Поиск" data-ic="search"></button><button class="sq blue" id="p2" aria-label="Новый контакт" data-ic="plus"></button></div>
    <div class="fnd" id="f2"><input id="q2" type="search" placeholder="Имя или @имя_пользователя"></div>
    <div id="conList"></div>
  </section>
  <section class="view on" id="vChats">
    <div class="top"><h1>Чаты</h1><button class="sq" id="s1" aria-label="Поиск" data-ic="search"></button><button class="sq blue" id="p1" aria-label="Новый чат" data-ic="plus"></button></div>
    <div class="fnd" id="f1"><input id="q" type="search" placeholder="Поиск чатов или @имя"></div>
    <div class="tabs" id="tabs"><button class="on" data-t="all">Все</button><button data-t="new" id="tNew">Новые</button><button data-t="ch" id="tCh">Каналы</button><i id="ind"></i></div>
    <div id="list"></div>
  </section>
  <section class="view right" id="vSet"><div id="setBody"></div></section>

  <nav id="nav">
    <i class="pill" id="pill" style="transform:translateX(100%)"></i>
    <button data-v="0"><span class="ico" data-ic="user" data-s="25"></span>Контакты</button>
    <button data-v="1" class="on"><span class="ico cico"><svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor" stroke="var(--card)" stroke-width="1.4" stroke-linejoin="round"><path d="M15.5 9.5C18.8 9.5 21.5 11.8 21.5 14.7c0 1.3-.5 2.4-1.3 3.3l.8 3-3.3-1.5c-.6.2-1.2.2-1.7.2-3.3 0-6-2.3-6-5.2s2.7-5 6-5z"/><path d="M9.5 3C13.1 3 16 5.5 16 9s-2.9 6-6.5 6c-.8 0-1.6-.1-2.3-.4L3.5 17l1.1-3.3C3.6 12.6 3 11.3 3 9c0-3.5 2.9-6 6.5-6z"/></svg><em class="nb" id="nb"></em></span>Чаты</button>
    <button data-v="2"><span class="ico" data-ic="gear" data-s="25"></span>Настройки</button>
  </nav>

  <section class="ov" id="chat">
    <div class="oh"><button class="ib2" id="back" aria-label="Назад" data-ic="back"></button><span id="cAva"></span><div class="who"><b id="cName"></b><small id="cSub"></small></div><button class="ib2" id="clr" aria-label="Очистить чат" data-ic="trash"></button></div>
    <div class="msgs" id="msgs"></div>
    <div class="emo" id="emo"></div>
    <div class="att" id="att"><button type="button" data-a="photo"><span class="ai" style="background:#34c759" data-ic="image" data-s="18"></span>Фото</button><button type="button" data-a="video"><span class="ai" style="background:#ff9f0a" data-ic="video" data-s="18"></span>Видео</button><button type="button" data-a="circle"><span class="ai" style="background:#2a9df4" data-ic="video" data-s="18"></span>Кружок</button></div>
    <input type="file" id="fAudio" accept="audio/*" capture hidden><input type="file" id="fAudio2" accept="audio/*" hidden><input type="file" id="fPhoto" accept="image/*" multiple hidden><input type="file" id="fVideo" accept="video/*" multiple hidden><input type="file" id="fAva" accept="image/*" hidden>
    <div class="rbar" id="rbar"><i></i><div class="rbt"><b id="rbN"></b><span id="rbT"></span></div><button type="button" id="rbX" aria-label="Отменить ответ">&times;</button></div><form class="compose" id="compose"><button type="button" class="ci" id="stk" aria-label="Эмодзи" data-ic="sticker" data-s="22"></button><input id="text" placeholder="Сообщение" autocomplete="off" enterkeyhint="send"><button type="button" class="ci" id="clip" aria-label="Прикрепить" data-ic="clip" data-s="24"></button><div class="rec" id="rec"><button type="button" class="ci" id="rCancel" aria-label="Отменить запись" data-ic="trash" data-s="20"></button><i class="rdot"></i><b id="rT">0:00</b><div class="lv" id="lv"></div></div><button type="button" class="ci" id="vcBtn" aria-label="Видеокружок" data-ic="video" data-s="22"></button><button type="button" class="send" id="sendBtn" aria-label="Отправить"><span class="ic mic" data-ic="mic" data-s="20"></span><span class="ic snd" data-ic="arrowup" data-s="20"></span></button></form>
    <div class="note" id="chNote" style="display:none">Писать в канал могут только администраторы</div>
  </section>
  <section class="ov" id="sub">
    <div class="oh"><button class="ib2" id="sBack" aria-label="Назад" data-ic="back"></button><h2 id="subT"></h2></div>
    <div id="subBody" style="flex:1;overflow-y:auto"></div>
  </section>

  <div class="vco" id="vco"><div class="vcw"><video id="vcPrev" muted playsinline></video><div class="vcT" id="vcT">0:00</div></div><div class="vcb"><button type="button" id="vcCancel">Отмена</button><button type="button" id="vcRec" aria-label="Запись"><i></i></button></div></div><div class="toast" id="toast"></div>

   <div class="logo"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M15.5 9.5C18.8 9.5 21.5 11.8 21.5 14.7c0 1.3-.5 2.4-1.3 3.3l.8 3-3.3-1.5c-.6.2-1.2.2-1.7.2-3.3 0-6-2.3-6-5.2s2.7-5 6-5z"/><path d="M9.5 3C13.1 3 16 5.5 16 9s-2.9 6-6.5 6c-.8 0-1.6-.1-2.3-.4L3.5 17l1.1-3.3C3.6 12.6 3 11.3 3 9c0-3.5 2.9-6 6.5-6z" opacity=".85"/></svg></div>
   <h1 id="aT"></h1><p class="sub" id="aS"></p>
   <div class="seg" id="seg"><i></i><button type="button" data-m="in" class="on">Вход</button><button type="button" data-m="up">Регистрация</button></div>
   <form id="aForm" novalidate>
    <label class="fl"><input id="aL" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"><span>Логин</span></label>
    <div class="fx"><label class="fl"><input id="aH" placeholder=" " autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="21"><span>Короткое имя, например @perviy</span></label></div>

    <div class="err" id="aE" role="alert"></div>
    <button class="go" id="aGo"></button>
   </form>
   <p class="hint2">Учебный режим: аккаунт хранится только на этом устройстве, на сервер данные не отправляются.</p>
  </div></section>
</div>

<script>

 if(!c){c={id:nid++,uid:u.id,name:u.name||u.login||'Пользователь',handle:u.handle,kind:'chat',pin:0,unread:0,online:u.online?1:0,keep:1,msgs:[]};chats.push(c)}
 else{if(u.name)c.name=u.name;if(u.handle)c.handle=u.handle;if(u.online!==undefined)c.online=u.online?1:0}return c}
function openPeer(u){const c=peerChat(u);save();$('sheet').classList.remove('open');openChat(c.id)}
function newRemote(){const h=normH($('newName').value);if(!h)return;
 api('/api/users/by-handle?h='+encodeURIComponent(h)).then(u=>{if(ME&&u.id===ME.id)return toast('Это вы');openPeer(u)}).catch(x=>toast(x.status?x.message:'Нет связи с сервером'))}
function mentionR(h){const c=chats.find(x=>x.handle===h);if(c)return openChat(c.id);
 api('/api/users/by-handle?h='+encodeURIComponent(h)).then(openPeer).catch(x=>toast(x.status?x.message:'Нет связи с сервером'))}
function remoteHandle(h,er){api('/api/handle',{method:'POST',json:{handle:h}}).then(r=>{ME=r.user;saveSessKeep();$('hSheet').classList.remove('open');renderSet(false);toast('Ваше имя: @'+h)}).catch(x=>er(x.status?x.message:'Нет связи с сервером'))}
function srvSearch(){clearTimeout(srvT);const q=$('q2').value.trim().replace(/^@/,'');if(q.length<2){srvRes=[];return}
 srvT=setTimeout(async()=>{try{srvRes=await api('/api/users?q='+encodeURIComponent(q));renderCon(false)}catch(e){}},250)}
function inMsg(d,peer,quiet,fresh){const mine=d.from===ME.id,c=peerChat(peer||{id:mine?d.to:d.from});
 S.last=Math.max(S.last||0,d.id);
 let x=c.msgs.find(q=>q.sid===d.id||(mine&&d.cid&&q.cid===d.cid));
 if(x){x.sid=d.id;x.ts=d.ts;if(x.st!=='read')x.st='sent';return x}
 x={me:mine?1:0,t:d.text||'',ts:d.ts,sid:d.id,cid:d.cid,st:'sent',rp:d.reply||undefined};
 if(d.kind!=='text'&&d.media){x.k=d.kind;x.rid=d.media.rid;x.mid='r'+d.media.rid;x.w=d.media.w;x.h=d.media.h;x.dur=d.media.dur;x.wave=d.media.wave;x.circ=d.media.circ?1:0}
 c.msgs.push(x);
 if(!mine){if(cur===c.id){if(!quiet)renderMsgs(true);sendRead(c)}else if(!fresh){c.unread++;if(!quiet)notify(c,x)}}
 else if(cur===c.id&&!quiet)renderMsgs();
 return x}
function sendRead(c){if(!c.uid)return;const l=[...c.msgs].reverse().find(x=>!x.me&&x.sid);if(!l||(c.readSent||0)>=l.sid)return;c.readSent=l.sid;
 api('/api/read',{method:'POST',json:{peer:c.uid,upTo:l.sid}}).catch(()=>{c.readSent=0})}
async function syncAll(){let more=true,g=0;const fresh=!(S.last>0);
 while(more&&g++<60){const r=await api('/api/sync?after='+(S.last||0));
  r.messages.forEach(d=>inMsg(d,r.peers[d.from===ME.id?d.to:d.from],true,fresh));
  r.reads.forEach(rd=>{const c=chats.find(x=>x.uid===rd.by);if(c)c.msgs.forEach(x=>{if(x.me&&x.sid&&x.sid<=rd.upTo)x.st='read'})});
  Object.values(r.peers).forEach(u=>{const c=chats.find(x=>x.uid===u.id);if(c)c.online=u.online?1:0});more=r.more}
 save();renderList(false);renderCon(false);if(cur!==null&&byId(cur)){renderMsgs();sendRead(byId(cur))}}
function handleEvt(blk){let ev='message',data='';
 for(const ln of blk.split('\n')){if(ln.startsWith('event:'))ev=ln.slice(6).trim();else if(ln.startsWith('data:'))data+=ln.slice(5).trim()}
 if(!data)return;let d;try{d=JSON.parse(data)}catch(e){return}
 if(ev==='message'){inMsg(d,d.peer);save();renderList(false)}
 else if(ev==='read'){const c=chats.find(x=>x.uid===d.by);if(c){c.msgs.forEach(x=>{if(x.me&&x.sid&&x.sid<=d.upTo)x.st='read'});save();if(cur===c.id)renderMsgs()}}
 else if(ev==='typing'){const c=chats.find(x=>x.uid===d.from);if(c){c.tp=Date.now()+3500;if(cur===c.id){setSt(c);setTimeout(()=>{if(cur===c.id)setSt(c)},3600)}}}
 else if(ev==='presence'){const c=chats.find(x=>x.uid===d.id);if(c){c.online=d.online?1:0;if(cur===c.id)setSt(c);renderCon(false)}}
 else if(ev==='hello'){chats.forEach(c=>{if(c.uid)c.online=d.online.includes(c.uid)?1:0})}}
function setNet(ok){netOk=ok;clearTimeout(netT);if(ok)$('net').classList.remove('show');else netT=setTimeout(()=>{if(!netOk)$('net').classList.add('show')},1200)}
function stopStream(){if(streamAbort){streamAbort.abort();streamAbort=null}setNet(true)}
async function connect(){if(!REMOTE||!TOKEN)return;if(streamAbort)streamAbort.abort();const ac=new AbortController();streamAbort=ac;setNet(false);
 try{await syncAll();
  const r=await fetch(SERVER+'/api/stream',{headers:{Authorization:'Bearer '+TOKEN,Accept:'text/event-stream'},signal:ac.signal});
  if(r.status===401){logout();return}if(!r.ok||!r.body)throw new Error('stream');
  setNet(true);backoff=1000;flushOutbox();
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n\n'))>=0){const blk=buf.slice(0,i);buf=buf.slice(i+2);handleEvt(blk)}}
 }catch(e){if(ac.signal.aborted)return}
 if(streamAbort!==ac)return;setNet(false);setTimeout(()=>{if(streamAbort===ac)connect()},backoff);backoff=Math.min(backoff*2,15000)}
addEventListener('online',()=>{if(REMOTE&&TOKEN)connect()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&REMOTE&&TOKEN&&!netOk)connect()});
async function uploadBlob(b){const r=await fetch(SERVER+'/api/upload',{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':(b.type||'application/octet-stream').split(';')[0]},body:b});
 if(!r.ok){let m='';try{m=(await r.json()).error}catch(e){}throw Object.assign(new Error(m||'Не удалось загрузить файл'),{status:r.status})}return(await r.json()).id}
async function outSend(c,x){if(!c.uid){x.st='failed';save();return}
 try{const body={to:c.uid,cid:x.cid,kind:x.k||'text'};
  if(x.k){if(!x.rid){let b=mem.get(x.mid);if(!b)b=await mget(x.mid);if(!b)throw Object.assign(new Error('Файл недоступен'),{status:400});x.rid=await uploadBlob(b)}
   body.media={rid:x.rid,w:x.w,h:x.h,dur:x.dur,wave:x.wave,circ:x.circ?1:0}}else body.text=x.t;if(x.rp)body.reply=x.rp;
  const r=await api('/api/messages',{method:'POST',json:body});x.sid=r.id;x.ts=r.ts;if(x.st!=='read')x.st='sent'}
 catch(e){x.st=(e.status&&e.status<500&&e.status!==429)?'failed':'queued';if(x.st==='failed'&&e.message)toast(e.message)}
 save();if(cur===c.id)renderMsgs();renderList(false)}
async function flushOutbox(){if(flushing)return;flushing=true;
 try{for(const c of chats)for(const x of c.msgs)if(x.me&&(x.st==='queued'||x.st==='sending')&&!x.sid)await outSend(c,x)}finally{flushing=false}}
setMode('in');
if(REMOTE){
 try{document.querySelector('.hint2').textContent='Сервер: '+new URL(SERVER).host;document.querySelector('#newForm h2').textContent='Найти по @имени';$('newName').placeholder='@короткое_имя';document.querySelector('#newForm .go').textContent='Найти'}catch(e){}
 const rs=getRemSess();if(rs&&rs.t&&rs.u){TOKEN=rs.t;ME=rs.u;$('auth').classList.add('nt','hide');bootRemote();setTimeout(()=>$('auth').classList.remove('nt'),80);api('/api/me').then(r=>{ME=r.user;saveSessKeep()}).catch(()=>{})}
}else{const su=getSess();if(su&&accs()[su]){$('auth').classList.add('nt','hide');boot(su);setTimeout(()=>$('auth').classList.remove('nt'),80)}}


/* ---------- обновление приложения (работает только в установленном APK) ---------- */
const APP_CODE=()=>{try{return Number(window.AndroidBridge&&AndroidBridge.appVersionCode())||0}catch(e){return 0}};
async function checkUpdate(){
 if(!REMOTE||!window.AndroidBridge)return;
 try{
   const r=await fetch(SERVER+'/api/app-version',{cache:'no-store'});
   if(!r.ok)return;
   const v=await r.json();
   if(v.versionCode&&v.versionCode>APP_CODE())showUpdate(v);
 }catch(e){}
}
function showUpdate(v){
 let bar=$('updBar');
 if(!bar){
   bar=document.createElement('div');bar.id='updBar';
   bar.style.cssText='position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:999;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)';
   document.body.appendChild(bar);
 }
 bar.innerHTML='<span id="updTxt" style="flex:1">Доступна версия '+(v.versionName||v.versionCode)+(v.notes?'. '+v.notes:'')+'</span><button id="updGo" style="border:0;border-radius:10px;padding:8px 12px;background:var(--acc);color:#fff;font-weight:600">Обновить</button>';
 $('updGo').onclick=()=>startUpdate(v);
}
function startUpdate(v){
 const url=/^https?:/.test(v.url)?v.url:SERVER+v.url;
 const btn=$('updGo');btn.disabled=true;btn.textContent='0%';
 window.__updProgress=p=>{const b=$('updGo');if(b)b.textContent=p+'%'};
 window.__updError=m=>{const b=$('updGo');if(b){b.disabled=false;b.textContent='Повторить'}const t=$('updTxt');if(t)t.textContent=m};
 AndroidBridge.installUpdate(url);
}
setTimeout(checkUpdate,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
</script>
